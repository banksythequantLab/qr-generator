<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Align items to the top */
            min-height: 100vh;
            background-color: #f0f2f5;
            padding: 2rem; /* Add some padding around the whole page */
            box-sizing: border-box; /* Include padding in element's total width and height */
        }
        .main-content {
            display: flex;
            gap: 2rem; /* Space between form and result */
            flex-wrap: wrap; /* Allow wrapping on smaller screens */
            justify-content: center; /* Center content when wrapped */
            max-width: 1200px; /* Max width for the main content area */
            width: 100%;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            flex: 1; /* Allow container to grow and shrink */
            min-width: 300px; /* Minimum width for the form container */
        }
        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        input[type="text"],
        input[type="file"],
        input[type="number"],
        select {
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        button {
            padding: 0.75rem;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            flex: 1; /* Allow result container to grow and shrink */
            min-width: 300px; /* Minimum width for the result container */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        #result-image {
            max-width: 100%;
            height: auto; /* Maintain aspect ratio */
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 1rem;
        }
        .download-button {
            display: inline-block; /* Make it behave like a button */
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            background-color: #28a745; /* Green color for download */
            color: white;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none; /* Remove underline from link */
            transition: background-color 0.3s;
        }
        .download-button:hover {
            background-color: #218838;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #09f;
            animation: spin 1s ease infinite;
            margin: 1rem auto;
            display: none; /* Hidden by default */
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="container">
            <h1>QR Code Generator</h1>
            <form id="qrForm">
                <div class="form-group">
                    <label for="url">URL to Encode:</label>
                    <input type="text" id="url" name="url" required value="https://www.google.com">
                </div>
                <div class="form-group">
                    <label for="image">Image File (for logo or background):</label>
                    <input type="file" id="image" name="image" required>
                </div>
                <div class="form-group">
                    <label for="mode">Mode:</label>
                    <select id="mode" name="mode">
                        <option value="overlay" selected>Overlay QR on Image</option>
                        <option value="logo">Use Image as Logo in QR</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="position">QR Position (for Overlay mode):</label>
                    <select id="position" name="position">
                        <option value="bottom_right" selected>Bottom Right</option>
                        <option value="bottom_left">Bottom Left</option>
                        <option value="top_right">Top Right</option>
                        <option value="top_left">Top Left</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="qr_size">QR Size (fraction of image width):</label>
                    <input type="number" id="qr_size" name="qr_size" min="0.1" max="1.0" step="0.05" value="0.2">
                </div>
                <div class="form-group">
                    <label for="margin">Margin (pixels):</label>
                    <input type="number" id="margin" name="margin" min="0" value="32">
                </div>
                <div class="form-group">
                    <label for="output_format">Output Format:</label>
                    <select id="output_format" name="output_format">
                        <option value="png" selected>PNG</option>
                        <option value="jpeg">JPEG</option>
                    </select>
                </div>
                <button type="submit">Generate QR Code</button>
            </form>
        </div>

        <div class="result-container">
            <h2>Generated QR Code</h2>
            <div id="spinner" class="spinner"></div>
            <img id="result-image" src="" alt="Generated QR Code" style="display: none;">
            <a id="download-link" class="download-button" style="display: none;">Download Image</a>
            <div id="error-message" style="color: red; margin-top: 1rem;"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('qrForm');
        const resultImage = document.getElementById('result-image');
        const downloadLink = document.getElementById('download-link');
        const spinner = document.getElementById('spinner');
        const errorMessageDiv = document.getElementById('error-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            resultImage.style.display = 'none';
            downloadLink.style.display = 'none';
            errorMessageDiv.innerHTML = '';
            spinner.style.display = 'block';

            const formData = new FormData(form);
            
            try {
                const response = await fetch('/qr-with-image', {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Something went wrong');
                }

                const imageBlob = await response.blob();
                const imageUrl = URL.createObjectURL(imageBlob);
                
                resultImage.src = imageUrl;
                resultImage.style.display = 'block';
                
                downloadLink.href = imageUrl;
                const format = formData.get('output_format');
                downloadLink.download = `qr_code.${format}`;
                downloadLink.style.display = 'inline-block';

            } catch (error) {
                errorMessageDiv.innerHTML = `<p>Error: ${error.message}</p>`;
            } finally {
                spinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
